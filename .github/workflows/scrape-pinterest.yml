name: Collect Pinterest Feed

on:
  workflow_dispatch: # Allows manual trigger from iPhone / GitHub App

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright python-dotenv
          playwright install chromium

      - name: Restore Pinterest Profile Session
        run: |
          mkdir -p .pinterest-browser-profile/Default
          if [ -n "${{ secrets.PINTEREST_PROFILE_BASE64 }}" ]; then
            echo "${{ secrets.PINTEREST_PROFILE_BASE64 }}" | base64 --decode > pinterest-cookies.json
          fi

      - name: Run Collector Script
        env:
          PINFRAMES_FEED_TOKEN: ${{ secrets.PINFRAMES_FEED_TOKEN }}
        run: |
          python collector.py --scrolls 15
